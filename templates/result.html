<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Plan Result</title>
  <style>
    /* Global Styles */
    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    h1 {
      text-align: center;
      margin: 40px 0 20px;
      color: #222;
      font-size: 2.2em;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    /* Week Card */
    .week {
      max-width: 700px;
      margin: 25px auto 50px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      animation: fadeIn 0.7s ease;
      position: relative;
      z-index: 2;
    }

    .week p,
    .week .task {
      line-height: 1.6;
      font-size: 1.05em;
      margin: 10px 0;
      color: #444;
    }

    .week p strong {
      color: #2e7d32;
    }

    .week .task {
      text-indent: 20px;
    }

    /* Back Button */
    .back-button {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #007bff;
      color: #fff;
      padding: 10px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
      transition: all 0.3s ease;
      z-index: 3;
    }

    .back-button:hover {
      background-color: #0056b3;
      box-shadow: 0 6px 16px rgba(0, 86, 179, 0.4);
      transform: translateY(-2px);
    }

    .back-button:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    /* Subtle animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Confetti Styles */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background-color: red;
      top: -10px;
      border-radius: 50%;
      opacity: 0.9;
      animation: fall 3s linear forwards;
      z-index: 1;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
        margin-top: 30px;
      }

      .week {
        margin: 15px;
        padding: 20px;
      }

      .back-button {
        padding: 8px 18px;
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <a href="/" class="back-button">Back</a>
  <h1>Workout Plan Result</h1>

  <div class="week">
    {% for line in response %}
      {{ line|safe }}
    {% endfor %}
  </div>

  <script>
    // Simple confetti burst animation
    function createConfettiPiece() {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');

      // Randomize color, size, and position
      const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#E85D75', '#9B5DE5'];
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.width = confetti.style.height = Math.random() * 8 + 6 + 'px';
      confetti.style.animationDuration = 2.5 + Math.random() * 2 + 's';

      document.body.appendChild(confetti);

      // Remove after animation ends
      setTimeout(() => confetti.remove(), 4000);
    }

    function launchConfettiBurst() {
      for (let i = 0; i < 60; i++) {
        setTimeout(createConfettiPiece, i * 50);
      }
    }

    // Launch confetti when page loads
    window.addEventListener('load', launchConfettiBurst);
  </script>
</body>
</html>
